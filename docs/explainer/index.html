<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Aval — 3-Minute Explainer</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="design-system/assets/favicon.png"/>
<link rel="stylesheet" href="design-system/colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script type="text/babel" data-presets="react">
function AvalApp() {
  return (
    <window.Stage width={1920} height={1080} duration={180} background="#f4f2ee" persistKey="aval-explainer">
      <window.AvalAnimation/>
    </window.Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AvalApp/>);
</script>
</body>
</html>
